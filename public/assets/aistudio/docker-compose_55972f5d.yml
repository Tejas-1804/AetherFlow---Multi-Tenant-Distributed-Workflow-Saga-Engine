version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workflow-engine-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/workflow_engine
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=production_enterprise_workflow_jwt_secret_9981
      - API_KEY_SECRET=production_api_key_salt_4421
    depends_on:
      - mongodb
      - redis
    networks:
      - orchestration-net
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: workflow-engine-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - orchestration-net
    command: ["--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped

  redis:
    image: redis:7.2-alpine
    container_name: workflow-engine-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - orchestration-net
    restart: unless-stopped

volumes:
  mongodb_data:
  redis_data:

networks:
  orchestration-net:
    driver: bridge
